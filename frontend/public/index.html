<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaWix - Gerador de Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; padding: 40px 20px; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; color: #64748b; }
        input, select { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { background: #6366f1; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.2s; }
        button:hover { background: #4f46e5; }
        #code-output { width: 100%; height: 250px; margin-top: 20px; font-family: monospace; font-size: 12px; padding: 12px; background: #1e293b; color: #e2e8f0; border-radius: 6px; display: none; }
        footer { text-align: center; margin-top: 40px; font-size: 14px; color: #64748b; }
        footer a { color: #6366f1; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Painel de Configuração</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 24px;">Configure seu widget e copie o código para o site.</p>

        <div class="grid">
            <div>
                <label>Tipo de Feed</label>
                <select id="cfg-type">
                    <option value="fixed">Faixa (5 posts fixos)</option>
                    <option value="custom">Grade</option>
                    <option value="paginated">Paginado (Páginas)</option>
                </select>
            </div>
            <div>
                <label>Layout (Colunas)</label>
                <input type="number" id="cfg-columns" value="5" min="1" max="6">
            </div>
        </div>

        <div class="grid">
            <div>
                <label>Arredondamento (px)</label>
                <input type="number" id="cfg-radius" value="8">
            </div>
            <div>
                <label>Espaçamento (px)</label>
                <input type="number" id="cfg-gap" value="12">
            </div>
        </div>

        <div class="grid">
            <div>
                <label>Cor da Legenda</label>
                <input type="color" id="cfg-cap-color" value="#ffffff">
            </div>
            <div>
                <label>Cor do Overlay (Fundo)</label>
                <input type="color" id="cfg-over-color" value="#000000">
            </div>
        </div>

        <button onclick="generateCode()">Gerar Código HTML</button>

        <textarea id="code-output" readonly></textarea>
    </div>

    <footer>
        <p>Idealizado por <a href="https://github.com/bernardocrvg" target="_blank">bernardocrvg</a> e feito por <a href="#" target="_blank">Emergent AI</a>.</p>
    </footer>

    <script>
        // Função para converter HEX em RGBA (Igualzinha a do React)
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha / 100})`;
        }

        function generateCode() {
            // Coleta os valores do formulário
            const type = document.getElementById('cfg-type').value;
            const columns = document.getElementById('cfg-columns').value;
            const radius = document.getElementById('cfg-radius').value;
            const gap = document.getElementById('cfg-gap').value;
            const capColor = document.getElementById('cfg-cap-color').value;
            const overColor = document.getElementById('cfg-over-color').value;
            
            const scriptUrl = window.location.href.replace('index.html', '').replace(/\/$/, '') + '/widget.js';
            const totalPosts = type === 'fixed' ? 5 : (columns * 2); // Exemplo simplificado
            
            // A mesma string CSS de CodeGenerator.jsx
            const css = `
#instawix-wrapper { display: flex; width: 100%; justify-content: center; }
#instawix-feed { display: grid; gap: ${gap}px; box-sizing: border-box; width: 100%; grid-template-columns: repeat(${type === 'fixed' ? 5 : columns}, 1fr); }
.instawix-post { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; position: relative; overflow: hidden; border-radius: ${radius}px; min-width: 50px; }
.instawix-post img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; display: block; border-radius: ${radius}px; }
.instawix-post:hover img { transform: scale(1.05); }
.instawix-overlay { position: absolute; inset: 0; background: ${hexToRgba(overColor, 50)}; opacity: 0; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center; padding: 1rem; border-radius: ${radius}px; }
.instawix-post:hover .instawix-overlay { opacity: 1; }
.instawix-caption { color: ${capColor}; font-family: 'Inter', sans-serif; font-size: 12px; text-align: center; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; margin: 0; }
.instawix-nav { display: flex; justify-content: center; gap: 10px; margin-top: 20px; width: 100%; grid-column: 1 / -1; }
.instawix-btn { font-family: 'Inter', sans-serif; border-radius: 4px; padding: 8px 16px; font-size: 14px; cursor: pointer; transition: all 0.2s; border: 1px solid #e5e5e5; background: #fff; color: #333; }
.instawix-btn:not(:disabled):hover { background: #000; color: #fff; border-color: #000; }
.instawix-btn:disabled { opacity: 0.5; cursor: default; }
.instawix-info { color: #666; font-size: 14px; align-self: center; }
@media (max-width: 768px) { #instawix-feed { grid-template-columns: repeat(${Math.min(columns, 3)}, 1fr); } }
@media (max-width: 480px) { #instawix-feed { grid-template-columns: repeat(${Math.min(columns, 2)}, 1fr); } }`;

            const html = `<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<div id="instawix-wrapper">
  <div 
    id="instawix-feed" 
    data-limit="${totalPosts}"
    data-type="${type}"
    data-per-page="10"
  ></div>
</div>
<script src="${scriptUrl}" async><\/script>
<style>${css}</style>
`;

            const output = document.getElementById('code-output');
            output.value = html;
            output.style.display = 'block';
            
            // Copia automaticamente
            navigator.clipboard.writeText(html);
            alert("Código copiado para a área de transferência! Cole no seu site.");
        }
    </script>
</body>
</html>
