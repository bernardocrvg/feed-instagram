<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget do Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Últimos 5 Posts</h2>
    <div id="widget-latest" class="grid-container">
        </div>

    <hr>

    <h2>Feed Completo</h2>
    <div id="widget-feed" class="grid-container">
        </div>
    
    <div class="pagination">
        <button id="btn-prev" disabled>Anterior</button>
        <span id="page-info">Página 1</span>
        <button id="btn-next">Próximo</button>
    </div>

    <script src="widget.js"></script>
</body>
</html>
