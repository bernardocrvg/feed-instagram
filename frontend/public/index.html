<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget do Instagram</title>
    <!-- Carregando a fonte idêntica ao projeto original -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 class="section-title">Últimos 5 Posts</h2>
    <div id="widget-latest" class="grid-container">
        <!-- O JavaScript vai injetar os 5 posts aqui -->
    </div>

    <hr class="divider">

    <h2 class="section-title">Feed Completo</h2>
    <div id="widget-feed" class="grid-container">
        <!-- O JavaScript vai injetar a página atual aqui -->
    </div>
    
    <!-- Controles de Paginação -->
    <div class="pagination">
        <button id="btn-prev" disabled>&lt; Anterior</button>
        <span id="page-info">Página 1</span>
        <button id="btn-next">Próximo &gt;</button>
    </div>

    <script src="widget.js"></script>
</body>
</html>
